<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1080" viewBox="0 0 1600 1080" role="img" aria-labelledby="title desc"><title id="title">One command. A complete story.</title><desc id="desc">CompleteTour(TourId) — from loading the aggregate to emitting TourCompleted.</desc><defs><radialGradient id="bg"><stop stop-color="#172d45"/><stop offset="1" stop-color="#090f20"/></radialGradient><linearGradient id="core" x2="1" y2="1"><stop stop-color="#142d3d"/><stop offset="1" stop-color="#121d33"/></linearGradient><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#67e8d4" stroke-width="1.5"/></marker><marker id="violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 1 1 L 9 5 L 1 9 Z" fill="#151f35" stroke="#baa5fa" stroke-width="1.3"/></marker><pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r=".8" fill="#7188a9" opacity=".12"/></pattern></defs><g font-family="Inter, DejaVu Sans, Arial, sans-serif"><rect width="1600" height="1080" rx="28" fill="url(#bg)"/><rect width="1600" height="1080" rx="28" fill="url(#dots)"/>
