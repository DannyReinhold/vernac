<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 410" role="img" aria-labelledby="title desc">
  <title id="title">One task operation, with clear responsibilities</title>
  <desc id="desc">A browser or API calls CompleteTask. The usecase loads a Task from the repository, invokes its complete method, then saves it. The repository's JDBC adapter accesses PostgreSQL. The domain has no HTTP or SQL dependency.</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8" fill="#086578"/></marker></defs>
  <rect width="850" height="410" rx="14" fill="#f1f6f8"/>
  <g font-family="system-ui, sans-serif" fill="#102639">
    <text x="32" y="39" font-size="21" font-weight="700">One operation. Clear responsibilities.</text>
    <rect x="30" y="85" width="190" height="90" rx="10" fill="#fff" stroke="#c2d6df"/>
    <text x="49" y="119" font-size="17" font-weight="650">Browser / HTTP</text><text x="49" y="147" font-size="14">Translate a request</text>
    <rect x="300" y="85" width="240" height="90" rx="10" fill="#102639"/>
    <text x="320" y="119" font-size="17" fill="#fff" font-weight="650">CompleteTask usecase</text><text x="320" y="147" font-size="14" fill="#cce0e9">Load → complete → save</text>
    <rect x="625" y="85" width="195" height="90" rx="10" fill="#dfeff0" stroke="#9bbec1"/>
    <text x="646" y="119" font-size="17" font-weight="650">Task aggregate</text><text x="646" y="147" font-size="14">Apply the domain rule</text>
    <path d="M220 130H288 M540 130H613" stroke="#086578" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="300" y="255" width="240" height="88" rx="10" fill="#fff" stroke="#c2d6df"/>
    <text x="320" y="290" font-size="17" font-weight="650">TaskRepository</text><text x="320" y="317" font-size="14">Load and save the whole task</text>
    <path d="M420 175V243" stroke="#086578" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="437" y="218" font-size="13">One transaction</text>
    <rect x="625" y="255" width="195" height="88" rx="10" fill="#fff" stroke="#c2d6df"/>
    <text x="646" y="290" font-size="17" font-weight="650">PostgreSQL</text><text x="646" y="317" font-size="14">Through a JDBC adapter</text>
    <path d="M540 299H613" stroke="#086578" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="32" y="383" font-size="14" fill="#526375">Arrows show calls. Domain behavior does not depend on HTTP or SQL.</text>
  </g>
</svg>
