<nav class="doc-navigation" aria-label="Documentation sections">
  {% assign current_path = page.url | replace: '/index.html', '/' %}
  {% for group in site.data.navigation %}
  <section>
    <h2>{{ group.title | escape }}</h2>
    <ul>
      {% for item in group.links %}
      {% assign item_path = item.url | replace: '/index.html', '/' %}
      <li><a href="{{ item.url | relative_url }}"{% if current_path == item_path %} aria-current="page"{% endif %}>{{ item.title | escape }}</a></li>
      {% endfor %}
    </ul>
  </section>
  {% endfor %}
</nav>
