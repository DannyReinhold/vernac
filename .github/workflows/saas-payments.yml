name: SaaS payment providers
on:
  pull_request:
    paths:
      - 'saas/payments*/**'
      - '.github/workflows/saas-payments.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  providers:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17.11
        env:
          POSTGRES_USER: vernac
          POSTGRES_PASSWORD: ephemeral-payment-only
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vernac -d postgres"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      VERNAC_PG_TEST_URL: jdbc:postgresql://localhost:5432/postgres
      VERNAC_PG_TEST_USER: vernac
      VERNAC_PG_TEST_PASSWORD: ephemeral-payment-only
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - name: Install matching compiler and runtime
        run: mvn -B -ntp -pl vernac-maven-plugin,vernac-jdbc-spring-boot-starter -am -DskipTests install
      - name: Install nominal identity and subscription contracts
        run: mvn -B -ntp -pl saas/identity,saas/subscriptions -DskipTests install
      - name: Verify shared payment port local provider Mollie and Stripe
        run: mvn -B -ntp -pl saas/payments,saas/payments-http,saas/payments-local,saas/payments-mollie,saas/payments-stripe,saas/payments-jdbc clean install
      - name: Replay local provider schema and compare generated model
        env:
          VERNAC_CHECK_URL: jdbc:postgresql://localhost:5432/postgres
          VERNAC_CHECK_USER: vernac
          VERNAC_CHECK_PASSWORD: ephemeral-payment-only
        run: mvn -B -ntp -pl saas/payments-local org.vernac:vernac-maven-plugin:0.6.0-SNAPSHOT:schema-check
      - name: Replay payment processing schema and routing constraints
        env:
          VERNAC_CHECK_URL: jdbc:postgresql://localhost:5432/postgres
          VERNAC_CHECK_USER: vernac
          VERNAC_CHECK_PASSWORD: ephemeral-payment-only
        run: mvn -B -ntp -pl saas/payments-jdbc org.vernac:vernac-maven-plugin:0.6.0-SNAPSHOT:schema-check
      - name: Require protocol and actual persistent local-provider proofs without skips
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          suites = {
              'saas/payments/target/surefire-reports/TEST-org.vernac.saas.payments.PaymentContractsTest.xml': 1,
              'saas/payments-http/target/surefire-reports/TEST-org.vernac.saas.payments.http.PaymentHttpTest.xml': 3,
              'saas/payments-mollie/target/surefire-reports/TEST-org.vernac.saas.payments.mollie.MolliePaymentsTest.xml': 2,
              'saas/payments-stripe/target/surefire-reports/TEST-org.vernac.saas.payments.stripe.StripePaymentsTest.xml': 2,
              'saas/payments-jdbc/target/failsafe-reports/TEST-org.vernac.saas.payments.persistence.PaymentFlowPostgresIT.xml': 8,
              'saas/payments-local/target/failsafe-reports/TEST-org.vernac.saas.payments.local.LocalPaymentsPostgresIT.xml': 3,
          }
          for path, count in suites.items():
              root = ET.parse(path).getroot()
              assert int(root.attrib['tests']) >= count
              assert all(int(root.attrib.get(key, '0')) == 0 for key in ('failures', 'errors', 'skipped'))
              assert all(not any(case.find(tag) is not None for tag in ('skipped', 'failure', 'error')) for case in root.findall('testcase'))
          PY
