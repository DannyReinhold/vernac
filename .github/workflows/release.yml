name: Vernac Release

run-name: Vernac ${{ inputs.version }} (dry-run=${{ inputs.dry_run }})

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, e.g. 0.2.0"
        required: true
        type: string
      dry_run:
        description: "Build and sign; no Central or Marketplace upload"
        required: true
        default: true
        type: boolean

permissions:
  contents: read
  actions: read

concurrency:
  group: vernac-release
  cancel-in-progress: false

jobs:
  release:
    name: Build and release
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      attempt: ${{ steps.candidate.outputs.attempt }}
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: vernac
          POSTGRES_PASSWORD: ephemeral-ci-only
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vernac -d postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      DRY_RUN: ${{ inputs.dry_run }}
      VERNAC_PG_TEST_URL: jdbc:postgresql://localhost:5432/postgres
      VERNAC_PG_TEST_USER: vernac
      VERNAC_PG_TEST_PASSWORD: ephemeral-ci-only

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check release version and history
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/release.py version
          for tag in "v$RELEASE_VERSION" "maven-v$RELEASE_VERSION" "plugin-v$RELEASE_VERSION"; do
            if git show-ref --verify --quiet "refs/tags/$tag"; then
              echo "::error::Release tag already exists. Inspect history; do not redeploy."
              exit 1
            fi
          done
          if [[ "$DRY_RUN" == "false" ]]; then
            python3 tools/release.py unpublished
          fi

      - name: Check release tooling
        run: python3 -m unittest discover -s tools/tests -v -b

      - name: Set up Java and Maven credentials
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          server-id: central
          server-username: CENTRAL_USERNAME
          server-password: CENTRAL_PASSWORD

      - name: Set up pinned Maven
        shell: bash
        run: |
          set -euo pipefail
          version=3.9.16
          archive="apache-maven-${version}-bin.tar.gz"
          base="https://repo.maven.apache.org/maven2/org/apache/maven/apache-maven/${version}"
          mkdir -p "$RUNNER_TEMP/vernac-maven"
          cd "$RUNNER_TEMP/vernac-maven"
          curl --fail --silent --show-error --location "$base/$archive" -o "$archive"
          curl --fail --silent --show-error --location "$base/$archive.sha512" -o "$archive.sha512"
          printf '%s  %s\n' "$(cat "$archive.sha512")" "$archive" | sha512sum --check -
          tar -xzf "$archive"
          echo "$PWD/apache-maven-${version}/bin" >> "$GITHUB_PATH"
          "$PWD/apache-maven-${version}/bin/mvn" --version

      - name: Verify complete project
        run: mvn -B -ntp -Drevision="$RELEASE_VERSION" clean verify

      - name: Require release test execution
        run: python3 tools/release.py tests

      - name: Prepare plugin candidate
        id: candidate
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/release.py candidate
          echo "attempt=$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"

      - name: Archive plugin candidate
        uses: actions/upload-artifact@v4
        with:
          name: vernac-plugin-${{ inputs.version }}-${{ github.run_attempt }}
          path: release-candidate/
          if-no-files-found: error
          retention-days: 90

      - name: Build and sign or upload
        shell: bash
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          MAVEN_GPG_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          goal=verify
          if [[ "$DRY_RUN" == "false" ]]; then goal=deploy; fi
          modules=$(python3 tools/release.py modules)
          mvn -B -ntp -Prelease -Drevision="$RELEASE_VERSION" \
            -Dgpg.signer=bc -pl "$modules" -am clean "$goal"

      - name: Record Central result
        shell: bash
        run: |
          if [[ "$DRY_RUN" == "true" ]]; then
            echo "Build/signing passed. Nothing uploaded. Plugin ZIP is available as a workflow artifact." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Central validation passed. Publish the EXISTING deployment in the Central Portal now. The plugin job waits up to 30 minutes for repository availability." >> "$GITHUB_STEP_SUMMARY"
            echo "If publication takes longer, run Publish IntelliJ Plugin with this run ID and candidate attempt; do not rerun Maven deployment." >> "$GITHUB_STEP_SUMMARY"
          fi

  marketplace:
    name: Marketplace
    needs: release
    uses: ./.github/workflows/publish-plugin.yml
    with:
      version: ${{ inputs.version }}
      source_run_id: ${{ github.run_id }}
      source_attempt: ${{ needs.release.outputs.attempt }}
      dry_run: ${{ inputs.dry_run }}
    secrets:
      JETBRAINS_MARKETPLACE_TOKEN: ${{ secrets.JETBRAINS_MARKETPLACE_TOKEN }}
