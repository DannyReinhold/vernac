name: IntelliJ debugger API regression

on:
  pull_request:
    paths:
      - 'vernac-intellij/**'
      - 'templates/**'
      - 'vernac-compiler/**'
      - 'vernac-lsp/**'
      - 'vernac-runtime/**'
      - 'vernac-runtime-http/**'
      - 'pom.xml'
      - 'tools/release.py'
      - '.github/workflows/intellij-compatibility.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  renderer-api:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - name: Build and test compiled renderer and actual plugin ZIP
        run: >-
          mvn -B -ntp -pl vernac-intellij,vernac-runtime-http -am
          -Dtest=SourceModuleVisibilityTest,InboundMvcContractTest,VernacFormatterTest,VernacFormattingServiceTest,VernacDebuggerApiTest,VernacViewInspectorTest,VernacSpringBootTemplateTest,VernacProjectTemplateTest,ScenarioDaemonLauncherTest,DevelopmentWebConfigurationTest,DevelopmentBundleCompilerTest,DevelopmentBuildServerTest
          -Dsurefire.failIfNoSpecifiedTests=false
          -Dit.test=PluginDistributionIT -Dfailsafe.failIfNoSpecifiedTests=false
          clean verify
      - name: Require the regression and distribution proofs without skips
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          proofs = {
              'surefire-reports/TEST-org.vernac.intellij.VernacDebuggerApiTest.xml': {
                  'guardDetectsTheHistoricalInternalSetterInCompiledCode',
                  'currentRendererUsesPublicApplicabilityWithoutTheInternalSetter',
              },
              'surefire-reports/TEST-org.vernac.intellij.debug.VernacViewInspectorTest.xml': {
                  'readsRealStoredValuesWithoutInvokingComputedGettersAndOnlySkipsPureReads',
              },
              'failsafe-reports/TEST-org.vernac.intellij.PluginDistributionIT.xml': {
                  'packagedPluginDoesNotReferenceRejectedInternalRendererApi',
                  'includesPluginTemplateAndExecutableLanguageServer',
              },
          }
          proofs['surefire-reports/TEST-org.vernac.intellij.VernacFormattingServiceTest.xml'] = {
              'fullFileReformatUsesTheCompilerFormatterAndSelectionDoesNotChangeUnselectedText',
              'standardReformatServiceIsRegisteredInThePluginDescriptor',
          }
          for report, expected in proofs.items():
              root = ET.parse(Path('vernac-intellij/target') / report).getroot()
              cases = {c.attrib['name']: c for c in root.findall('testcase')}
              assert not (expected - cases.keys()), f'Missing debugger API proofs: {report}'
              assert all(int(root.attrib.get(k, '0')) == 0 for k in ('failures', 'errors', 'skipped'))
              assert all(not any(c.find(k) is not None for k in ('failure', 'error', 'skipped')) for c in cases.values())
          formatter = ET.parse('vernac-compiler/target/surefire-reports/TEST-org.vernac.compiler.format.VernacFormatterTest.xml').getroot()
          assert int(formatter.attrib['tests']) >= 5
          assert all(int(formatter.attrib.get(k, '0')) == 0 for k in ('failures', 'errors', 'skipped'))
          cli = ET.parse('vernac-compiler/target/surefire-reports/TEST-org.vernac.compiler.pipeline.ScenarioDaemonLauncherTest.xml').getroot()
          assert 'buildsTheRequestedProjectWithItsWrapperAndKeepsLogsOffProtocolOutput' in {case.attrib['name'] for case in cli.findall('testcase')}
          assert all(int(cli.attrib.get(k, '0')) == 0 for k in ('failures', 'errors', 'skipped'))
          revisions = ET.parse('vernac-runtime-http/target/surefire-reports/TEST-org.vernac.runtime.http.development.DevelopmentWebConfigurationTest.xml').getroot()
          assert int(revisions.attrib['tests']) >= 3
          assert all(int(revisions.attrib.get(k, '0')) == 0 for k in ('failures', 'errors', 'skipped'))
          bundles = ET.parse('vernac-compiler/target/surefire-reports/TEST-org.vernac.compiler.pipeline.DevelopmentBundleCompilerTest.xml').getroot()
          assert int(bundles.attrib['tests']) == 2
          assert all(int(bundles.attrib.get(k, '0')) == 0 for k in ('failures', 'errors', 'skipped'))
          server = ET.parse('vernac-compiler/target/surefire-reports/TEST-org.vernac.compiler.pipeline.DevelopmentBuildServerTest.xml').getroot()
          assert int(server.attrib['tests']) >= 1
          assert all(int(server.attrib.get(k, '0')) == 0 for k in ('failures', 'errors', 'skipped'))
          print('Known internal-API regression and packaged distribution proofs passed; none skipped.')
          PY

      - name: Upload tested IntelliJ plugin
        uses: actions/upload-artifact@v4
        with:
          name: vernac-intellij-plugin
          path: vernac-intellij/target/*-plugin.zip
          if-no-files-found: error
