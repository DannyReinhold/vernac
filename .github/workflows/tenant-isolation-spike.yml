name: Tenant isolation feasibility

on:
  pull_request:
    paths:
      - 'experiments/tenant-isolation-spike/**'
      - 'saas/**'
      - 'templates/**'
      - 'examples/persistent-modules/**'
      - 'tools/release.py'
      - 'tools/identity_password_corpus.py'
      - '.gitattributes'
      - 'tools/tests/**'
      - 'vernac-runtime/**'
      - 'vernac-runtime-jdbc/**'
      - 'vernac-compiler/**'
      - 'vernac-lsp/**'
      - 'vernac-maven-plugin/**'
      - 'pom.xml'
      - '.github/workflows/tenant-isolation-spike.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  spike:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17.11
        env:
          POSTGRES_USER: vernac
          POSTGRES_PASSWORD: ephemeral-spike-only
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vernac -d postgres"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      VERNAC_PG_TEST_URL: jdbc:postgresql://localhost:5432/postgres
      VERNAC_PG_TEST_USER: vernac
      VERNAC_PG_TEST_PASSWORD: ephemeral-spike-only
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - name: Build production runtime and run its unit tests
        run: mvn -B -ntp -pl vernac-lsp,vernac-runtime-http,vernac-runtime-jdbc -am clean install
      - name: Build the compiler plugin for optional SaaS modules
        run: mvn -B -ntp -pl vernac-maven-plugin,vernac-jdbc-spring-boot-starter -am -DskipTests install
      - name: Verify shared mail and selected local/Brevo providers
        run: mvn -B -ntp -pl saas/mail,saas/mail-local,saas/mail-brevo clean install
      - name: Verify optional identity artifacts and their JAR consumer
        run: mvn -B -ntp -pl saas/identity,saas/identity-spring-security,saas/identity-jdbc clean verify
      - name: Verify Boot module startup and actual HTTP JSON converter selection
        run: mvn -B -ntp -f examples/persistent-modules/pom.xml clean verify
      - name: Check release tooling and documentation links
        run: |
          python3 -m unittest discover -s tools/tests -v -b
          python3 tools/check-doc-links.py
      - name: Execute real PostgreSQL and Spring boundary tests
        run: mvn -B -ntp -f experiments/tenant-isolation-spike/pom.xml clean verify
      - name: Execute tenant schema replay and schema-check policy proofs
        run: mvn -B -ntp -pl vernac-maven-plugin -am -Dtest=UniquePersistencePostgresTest,UniqueModulePostgresTest,UseCaseAccessAuditExecutionTest,VernacCompileMojoTest,TypeModuleExecutionTest,ModulePersistenceMojoTest,InboundErrorPolicyExecutionTest,InboundMvcExecutionTest,TenantEventWorkerPostgresTest,EventSchemaPostgresTest,DocumentationExamplesTest,TenantSchemaPostgresTest,SchemaMojoTest,ExplicitTenancyMojoTest,TenantModuleActivationPostgresTest,TenantGeneratedPostgresTest,RepositoryQueryPostgresTest,ScalarQueryPostgresTest,ModuleMigrationPostgresTest,EventStoragePostgresTest,EventWorkerPostgresTest -Dsurefire.failIfNoSpecifiedTests=false test
      - name: Require every spike proof to execute
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          report = Path('experiments/tenant-isolation-spike/target/surefire-reports/TEST-org.vernac.experiments.tenancy.TenantIsolationPostgresTest.xml')
          root = ET.parse(report).getroot()
          required = {
              'missingAuthenticationMembershipAndTransactionFailClosed',
              'byIdFindOrCountAndRawSqlAreTenantScoped',
              'unmarkedGlobalDataNeedsNoTenantAndDoesNotBindOne',
              'runtimeRoleAndForcedOwnerProtectionAreReal',
              'coordinatorRejectsIncompleteConfigurationAndUnsafeChildTables',
              'coordinatorRejectsSchemaCreationAndTruncatePrivileges',
              'rowSecurityBlocksCrossTenantWritesAndForeignKeysBlockCrossTenantLinks',
              'requiredAndRequiresNewBindDifferentConnectionsAndRestoreOuterContext',
              'caughtInnerRequiredFailureMakesOuterTransactionRollbackOnly',
              'innerPermissionIsCheckedOnlyWhenReachedAndBeforeItsBody',
              'ownershipAndRollbackPreventRetaggingWhileStaleVersionsStillConflict',
              'sameThreadAndPooledConnectionsDoNotLeakAcrossRepeatedRequestsOrRollback',
              'twoThreadsHaveIndependentSecuritySelectionsAndPhysicalTransactions',
              'staleSessionTenantAndMidTransactionSettingTamperingAreRejected',
          }
          cases = {case.attrib['name']: case for case in root.findall('testcase')}
          missing = required - cases.keys()
          assert not missing, f'Missing required proofs: {sorted(missing)}'
          for name, case in cases.items():
              assert not any(case.find(tag) is not None for tag in ('skipped', 'failure', 'error')), f'Unverified proof: {name}'
          assert all(int(root.attrib.get(key, '0')) == 0 for key in ('failures', 'errors', 'skipped'))
          print(f'{len(cases)} real PostgreSQL/Spring proofs executed; none skipped.')
          event_report = Path('experiments/tenant-isolation-spike/target/surefire-reports/TEST-org.vernac.experiments.tenancy.TenantEventRoutingPostgresTest.xml')
          event_root = ET.parse(event_report).getroot()
          event_required = {
              'nullableForeignKeysNeedANonNullScopeKeyForGlobalChildren',
              'payloadPolicyAndExactOriginLoadingRejectCrossTenantAndForgedRouting',
              'graphAndDeliveriesRollbackAtomicallyAndFirstRecipientsStayFixed',
              'retryAfterWorkerRestartRetainsOriginAndOtherRecipientsContinue',
              'expiredClaimsFenceOldWritesAndFinalAttemptCrashesDoNotStick',
              'parallelWorkersClaimOnceAndUseIndependentTenantTransactions',
              'contaminatedPooledSessionsCannotLoadGlobalPayloadsAsAFallback',
          }
          event_cases = {case.attrib['name']: case for case in event_root.findall('testcase')}
          assert not (event_required - event_cases.keys()), 'Missing event-routing proofs'
          assert all(int(event_root.attrib.get(key, '0')) == 0 for key in ('failures', 'errors', 'skipped'))
          for name, case in event_cases.items():
              assert not any(case.find(tag) is not None for tag in ('skipped', 'failure', 'error')), f'Unverified event proof: {name}'
          print(f'{len(event_cases)} event-routing feasibility proofs executed; none skipped.')
          auth_report = Path('experiments/tenant-isolation-spike/target/surefire-reports/TEST-org.vernac.experiments.tenancy.AuthorizationEntryPostgresTest.xml')
          auth_root = ET.parse(auth_report).getroot()
          auth_required = {
              'guardOrdersNullPermissionValidationBodyAndResult',
              'nestedChecksRunOnlyWhenReachedAndRequiredFailureRollsBackAllWrites',
              'allAnyShortCircuitAndTechnicalFailureNeverBecomesAnotherAlternative',
              'absentForeignAndWrongNominalResourcesDenyWithoutDisclosingExistence',
              'directEntryMissingInfrastructureAndAnonymousNeverReachPolicyOrBody',
              'nestedActorOrTenantReplacementFailsAndTechnicalActorsAreExplicit',
              'reusedExecutorClearsInvocationTenantAndAuthenticationAfterFailure',
              'restAndMvcUseTerminalSafeFailuresBeforeGenericErrorHooks',
              'applicationFilterChainKeepsLoginAndCsrfWithoutDuplicatingPermissionChecks',
          }
          auth_cases = {case.attrib['name']: case for case in auth_root.findall('testcase')}
          assert not (auth_required - auth_cases.keys()), 'Missing authorization-entry proofs'
          assert all(int(auth_root.attrib.get(key, '0')) == 0 for key in ('failures', 'errors', 'skipped'))
          for name, case in auth_cases.items():
              assert not any(case.find(tag) is not None for tag in ('skipped', 'failure', 'error')), f'Unverified authorization proof: {name}'
          print(f'{len(auth_cases)} authorization-entry feasibility proofs executed; none skipped.')
          generated_report = Path('experiments/tenant-isolation-spike/target/surefire-reports/TEST-org.vernac.experiments.tenancy.GeneratedAuthorizationPostgresTest.xml')
          generated_root = ET.parse(generated_report).getroot()
          generated_required = {
              'nullChecksAndPermissionDenialsPrecedeGeneratedValidationAndInlineBody',
              'generatedPublicOuterChecksOnlyReachedInnerAndRetainsRequiredRollback',
              'externalImplementationHasTheSameGuardAndDirectConstructionCannotSupplyATransaction',
              'publicAndAuthenticatedModesPreserveTheirDifferentActorRequirements',
              'crossTenantPolicyReadsCannotAuthorizeTheSameNominalId',
              'publicEntryWorksWithoutAuthorizationBeansButProtectedBeanFailsStartup',
          }
          generated_cases = {c.attrib['name']: c for c in generated_root.findall('testcase')}
          assert not (generated_required - generated_cases.keys()), 'Missing generated authorization proofs'
          assert all(int(generated_root.attrib.get(k, '0')) == 0 for k in ('failures', 'errors', 'skipped'))
          for name, case in generated_cases.items():
              assert not any(case.find(k) is not None for k in ('failure', 'error', 'skipped')), f'Unverified generated authorization proof: {name}'
          print(f'{len(generated_cases)} generated authorization/Spring/PostgreSQL proofs executed; none skipped.')
          module_report = Path('experiments/tenant-isolation-spike/target/surefire-reports/TEST-org.vernac.experiments.tenancy.ModuleAuthorizationPostgresTest.xml')
          module_root = ET.parse(module_report).getroot()
          module_required = generated_required | {'consumerAndActivatedModuleShareActorTenantAndTheRequiredTransaction'}
          module_cases = {c.attrib['name']: c for c in module_root.findall('testcase')}
          assert not (module_required - module_cases.keys()), 'Missing real module-JAR authorization proofs'
          assert all(int(module_root.attrib.get(k, '0')) == 0 for k in ('failures', 'errors', 'skipped'))
          for name, case in module_cases.items():
              assert not any(case.find(k) is not None for k in ('failure', 'error', 'skipped')), f'Unverified module authorization proof: {name}'
          print(f'{len(module_cases)} module-JAR/Spring/PostgreSQL authorization proofs executed; none skipped.')
          representation_proofs = {
              'vernac-compiler/target/surefire-reports/TEST-org.vernac.compiler.pipeline.ValueStringRepresentationTest.xml': {
                  'customRepresentationRedactsNestedValuesWithoutChangingStateOrEquality',
                  'invalidOverridesDuplicateSignaturesAndGetterCollisionsFailBeforeJavaGeneration',
                  'nullCustomRepresentationFailsWithTheExistingSafeBehaviorContract',
                  'liveEditorUsesTheSameRepresentationMethodAndRejectsInvalidSignatures',
              },
              'vernac-lsp/target/surefire-reports/TEST-org.vernac.lsp.VernacProjectDiagnosticsTest.xml': {
                  'valueStringRepresentationDiagnosticsFollowUnsavedEdits',
              },
          }
          for path, expected in representation_proofs.items():
              root = ET.parse(path).getroot()
              cases = {c.attrib['name']: c for c in root.findall('testcase')}
              assert not (expected - cases.keys()), f'Missing representation proofs: {path}'
              assert all(int(root.attrib.get(k, '0')) == 0 for k in ('failures', 'errors', 'skipped'))
              for case in cases.values():
                  assert not any(case.find(t) is not None for t in ('skipped', 'failure', 'error'))
          print('Value representation and unsaved LSP proofs executed; none skipped.')
          uniqueness_proofs = {
              'vernac-compiler/target/surefire-reports/TEST-org.vernac.compiler.pipeline.UniqueAggregateFieldsTest.xml': {
                  'omittedExplicitAndQualifiedNamesUseTheNormalEffectiveName',
                  'independentModifiersAndSupportedNominalTypesRetainDomainMeaning',
                  'rejectsUnsupportedEqualityAndPresenceBeforeJavaGeneration',
                  'rejectsWrongDeclarationKindsAndRepeatedModifiersAtTheirSource',
                  'contextualUniqueIdentifiersAndDerivedNameCollisionsKeepTheirContracts',
                  'generatedObjectsCompileWithoutInventingAnInMemoryUniquenessRegistry',
                  'persistenceAdoptionCarriesTheDerivedConstraintIntoSchemaAndRepository',
                  'unsavedAnalysisAndNativeTypeReferencesRetainTheDerivedField',
              },
              'vernac-compiler/target/surefire-reports/TEST-org.vernac.compiler.modules.UniqueFieldModuleTest.xml': {
                  'publicationRoundTripAndContractViewsPreserveTheFieldRequirement',
                  'uniquenessAndMutabilityParticipateInCompatibilityFingerprints',
                  'oldContractVersionsAreRejectedInsteadOfDroppingUniqueMetadata',
              },
              'vernac-compiler/target/surefire-reports/TEST-org.vernac.compiler.persistence.UniquePersistenceSchemaTest.xml': {
                  'stableDerivedNamesAndScopeUseResolvedStorageColumns',
                  'explicitCollationRoundTripsWithoutChangingLegacySnapshotBytes',
                  'migrationAddRemoveAndFieldChangeKeepConstraintAndCollationTogether',
              },
              'vernac-lsp/target/surefire-reports/TEST-org.vernac.lsp.UniqueFieldSymbolsTest.xml': {
                  'omittedFieldNamesPreserveTypeNavigationAndIncompleteTypeCompletion',
                  'hoverExplainsScopeAndDatabaseEnforcement',
                  'modifierCompletionIsAggregateLocalAndDoesNotRepeatExistingMarkers',
              },
              'vernac-maven-plugin/target/surefire-reports/TEST-org.vernac.maven.UniquePersistencePostgresTest.xml': {
                  'sharedDatabaseRejectsConflictingInsertUpdateAndKeepsRollbackRestartSemantics',
                  'caughtConflictPoisonsItsWriterAndWrongOrReadOnlyBoundariesFailBeforeWrites',
                  'tenantKeysAreScopedAndExactTextSpellingsRemainDistinct',
                  'independentContextsHaveOneWinnerForInsertAndUpdateRaces',
                  'nonmatchingErrorsStayTechnicalAndOversizedIndexInputsAreSanitized',
                  'migrationReplayCatalogAndCollationDriftMatchTheSharedModel',
                  'schemaCheckGoalReplaysFormatFourHistoryAndDetectsCollationOnlyDrift',
              },
              'vernac-maven-plugin/target/surefire-reports/TEST-org.vernac.maven.UniqueModulePostgresTest.xml': {
                  'packagedModuleReplaysFormatFourAndRejectsConflictAndCollationDriftOnRestart',
              },
          }
          for path, expected in uniqueness_proofs.items():
              root = ET.parse(path).getroot()
              cases = {c.attrib['name']: c for c in root.findall('testcase')}
              assert not (expected - cases.keys()), f'Missing unique field enforcement proofs: {path}'
              assert all(int(root.attrib.get(k, '0')) == 0 for k in ('failures', 'errors', 'skipped'))
              for case in cases.values():
                  assert not any(case.find(t) is not None for t in ('skipped', 'failure', 'error'))
          print('Unique aggregate/compiler/schema/JDBC/module/editor proofs executed; none skipped.')
          mail_proofs = {
              'saas/mail/target/surefire-reports/TEST-org.vernac.saas.mail.MailContractsTest.xml': {
                  'boundedValuesKeepClearContentOutOfStringRepresentations',
                  'standardAddressParserAndHeaderBoundsRejectInjection',
                  'bodyUtf8SizeAndMalformedUnicodeAreBounded',
                  'outcomesHaveFiniteRetryHintsAndNoFalseAcceptance',
              },
              'saas/mail-local/target/surefire-reports/TEST-org.vernac.saas.mail.local.LocalMailInboxTest.xml': {
                  'defaultAcceptsWithoutNetworkAndCapacityNeverEvictsLiveMessages',
                  'expiryAndScriptedFailuresFollowTheSameSubmissionContract',
              },
              'saas/mail-brevo/target/surefire-reports/TEST-org.vernac.saas.mail.brevo.BrevoMailTransportTest.xml': {
                  'standardBrevoRequestHasOneRecipientAndNeverReturnsProviderBody',
                  'retryHintsPermanentFailuresAndRedirectsStayWithinThePortContract',
                  'fullCallTimeoutAndParallelAdmissionAreBounded',
                  'retryAfterZeroDoesNotCauseHiddenHttpResubmission',
                  'invalidConfigurationAndNonLoopbackTestTargetsAreRejectedWithoutSecrets',
              },
              'saas/mail-brevo/target/surefire-reports/TEST-org.vernac.saas.mail.brevo.MailProviderSelectionTest.xml': {
                  'normalBindingSelectsOnlyNoopWithoutAnyBrevoCredentialsOrStartupNetwork',
                  'selectedBrevoRequiresConfigurationAndNeverFallsBackToNoop',
              },
              'saas/mail-brevo/target/surefire-reports/TEST-org.vernac.saas.mail.brevo.MailModuleConsumerTest.xml': {
                  'compiledModulesDriveTheOrdinaryConsumerBindingWithoutRegeneratingProviders',
              },
          }
          for path, expected in mail_proofs.items():
              root = ET.parse(path).getroot()
              cases = {c.attrib['name']: c for c in root.findall('testcase')}
              assert not (expected - cases.keys()), f'Missing mail provider proofs: {path}'
              assert all(int(root.attrib.get(k, '0')) == 0 for k in ('failures', 'errors', 'skipped'))
              for case in cases.values():
                  assert not any(case.find(t) is not None for t in ('skipped', 'failure', 'error'))
          print('Shared mail provider and compiled consumer proofs executed; none skipped.')
          saas_proofs = {
              'saas/identity-jdbc/target/surefire-reports/TEST-org.vernac.saas.identity.persistence.IdentityDeliveryCryptoTest.xml': {
                  'encryptionBindsContextAndSurvivesReconstruction',
                  'everyTrustedContextFieldRejectsCiphertextSubstitution',
                  'rotatedKeyRingReadsOldJobsAndRejectsRemovalOrRekeying',
                  'malformedTamperedAndOversizedInputsNeverExposeLibraryExceptions',
                  'boundsAndExpiryRejectEncryptionButPreparedAttemptsRemainSpent',
                  'missingInvalidOrExcessKeysFailClosedAndCallerMutationCannotChangeKeys',
                  'refusedAdmissionCannotEncryptAndItsExceptionIsSanitized',
                  'concurrentCallersCannotBypassTheirSharedAdmissionBoundary',
                  'preparedPermitIsSingleUseAndBoundToItsEncryptor',
              },
              'saas/identity-jdbc/target/surefire-reports/TEST-org.vernac.saas.identity.persistence.IdentityLoginAddressModelTest.xml': {
                  'canonicalAndDeliveryValuesReuseTheExistingAddressPolicyAndRedactRepresentations',
              },
              'saas/identity-jdbc/target/failsafe-reports/TEST-org.vernac.saas.identity.persistence.IdentityMailWorkerPostgresIT.xml': {
                  'submissionRunsOutsideTransactionsAndAcceptedPayloadIsErasedOnce',
                  'retriesKeepOneChargedEnvelopeAndRespectBackoffWithoutReencryption',
                  'crashedClaimsAreFencedAndExhaustionReclaimsOnlyAfterLeaseExpiry',
                  'missingReadKeysPauseClaimsAndExpiryStillCleansChargedRows',
                  'consumedLeasedWorkStaysChargedUntilItsOwnerSettles',
                  'twoApplicationContextsCannotSubmitOneLiveLeaseTwice',
                  'contaminatedContextsCannotClaimAndPollingWaitsForOutstandingDeliveryOnStop',
                  'corruptEnvelopesAndClosedOwnersNeverReachTheProvider',
              },
              'saas/identity-jdbc/target/failsafe-reports/TEST-org.vernac.saas.identity.persistence.IdentityMailRequestsPostgresIT.xml': {
                  'registrationPersistsOnlyProtectedMailAndCooldownReusesOriginalOwner',
                  'restartAndChallengeConsumptionKeepSecretErasureAndRefundAtomic',
                  'fullJobOrByteBudgetFailsBeforeKnownAndUnknownLookupWithoutLeaks',
                  'rollbackAndCaughtEncryptionFailureCannotLeaveIdentityChallengeOrJob',
                  'resendReplacesQueuedWorkButRetainsChargedLeasedPayload',
                  'lastBacklogSlotIsAtomicAcrossConcurrentInstances',
                  'recoveryUnknownAndIneligibleOwnersAllocateNothing',
              },
              'saas/identity-jdbc/target/failsafe-reports/TEST-org.vernac.saas.identity.persistence.IdentityEncryptionAdmissionPostgresIT.xml': {
                  'attemptsSurviveUnusedPermitsBusinessRollbackAndRestart',
                  'twoInstancesCompeteForTheLastAttemptWithoutResettingTheCap',
                  'keyIdentityAliasesAndBoundedHistoryFailClosedAcrossRestart',
                  'damagedRegistryCannotSilentlyRestartFromZero',
              },
              'saas/identity-jdbc/target/failsafe-reports/TEST-org.vernac.saas.identity.persistence.IdentityLoginOwnershipPostgresIT.xml': {
                  'canonicalRepeatsPreserveOriginalSpellingDeadlineAndOneOwnerWithoutAliasFolding',
                  'independentContextsHaveOneCreatorAndRetainOwnershipAcrossRestart',
                  'capacityPressureIsUniformBeforeLookupAndRollbackLeavesNoIdentityOrClaim',
                  'activationDisablingAndClosureKeepTheOriginalKeyAndCannotIssueAnotherRegistration',
                  'abandonedClaimIsReleasedAtomicallyAndOldLiveTokenCannotFollowTheNewOwner',
                  'addressWriteAndCleanupFailuresRollBackAllDependentRowsAndCapacity',
                  'databaseConstraintIsExactAndLegacyUnclaimedPendingRowsAreNotInventedIntoAddresses',
                  'cleanupRacingWithAnotherRequestCannotDeleteTheFreshOwner',
              },

              'saas/identity-jdbc/target/failsafe-reports/TEST-org.vernac.saas.identity.persistence.IdentityRegistrationsPostgresIT.xml': {
                  'deadlineIsImmutableExactAndSurvivesRestart',
                  'twoCleanersReleaseOnlyTheWinnerAndCompletionFailureRestoresAllocation',
                  'concurrentLastSlotAndRollbackNeverLeakPendingIdentities',
                  'challengeCompletionProvisioningAndCapacityAreOneRollbackBoundary',
                  'indexedSweepIsBoundedAndRefundsActualDependenciesOnlyOnce',
                  'cleanupAndActivationAcrossContextsHaveExactlyOneWinner',
                  'cleanupFailureAndInconsistentEligibilityFailClosedWithoutDeletingActiveState',
              },
              'saas/identity-jdbc/target/surefire-reports/TEST-org.vernac.saas.identity.persistence.AdmissionDigestsTest.xml': {
                  'jcaKeyedPseudonymsAreStableSeparatedAndDoNotMutateCallerMaterial',
                  'missingInvalidAndUnavailableKeysFailWithoutSecretCauses',
              },
              'saas/identity-jdbc/target/surefire-reports/TEST-org.vernac.saas.identity.persistence.IdentityAdmissionModelTest.xml': {
                  'countsCannotOverflowAndClockHighWaterNeverMovesBackwards',
              },
              'saas/identity-jdbc/target/failsafe-reports/TEST-org.vernac.saas.identity.persistence.IdentityAdmissionPostgresIT.xml': {
                  'defaultPoliciesCanonicalKeysPurposesAndSourceAttemptsAreIndependent',
                  'windowsRestartBusinessRollbackAndKeyDriftNeverResetSpentAttempts',
                  'capacityPressureIsUniformAndBoundedCleanupReclaimsOnlyDeletedRows',
                  'independentContextsShareLastSubjectAttemptAndDoNotDoubleReleaseCleanup',
