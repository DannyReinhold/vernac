                  'wrongOrReadOnlyTransactionsFailAndTenantScopeAndVersionsArePreserved',
                  'upgradingThePublishedIdentitySchemaPreservesExistingIdentities',
              },
              'saas/identity-spring-security/target/surefire-reports/TEST-org.vernac.saas.identity.security.credentials.BundledPasswordBlocklistTest.xml': {
                  'bundledSnapshotLoadsWithPinnedVersionAndRealEligibleEntries',
                  'standardEncoderRejectsRealWeakSecretsAndStillAcceptsAnIndependentPhrase',
