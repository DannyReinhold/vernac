                  'generatedVerifierAndContainingChallengeDoNotRenderTheStoredHash',
              },
              'saas/identity-jdbc/target/surefire-reports/TEST-org.vernac.saas.identity.persistence.IdentityIngressModelTest.xml': {
                  'maximumCounterDoesNotOverflowAndClockRegressionDoesNotReset',
              },
              'saas/identity-jdbc/target/failsafe-reports/TEST-org.vernac.saas.identity.persistence.IdentityIngressPostgresIT.xml': {
                  'exactWindowsRollbackRestartAndConfigurationPreserveSpentAttempts',
                  'twoContextsBootstrapOnceAndCompeteForTheLastAdmission',
