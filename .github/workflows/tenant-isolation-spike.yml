              'saas/identity-spring-security/target/surefire-reports/TEST-org.vernac.saas.identity.security.credentials.LoginAddressTest.xml': {
                  'preservesDeliveryAndMakesOnlyTheDeclaredLoginKeyTransformation',
                  'localeDoesNotChangeLoginIdentity',
                  'boundsAddressLocalPartAndDnsLabelsPrecisely',
