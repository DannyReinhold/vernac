name: Tenant isolation feasibility

on:
  pull_request:
    paths:
      - 'experiments/tenant-isolation-spike/**'
      - 'vernac-runtime/**'
      - 'vernac-runtime-jdbc/**'
      - 'vernac-compiler/**'
      - 'vernac-lsp/**'
      - 'vernac-maven-plugin/**'
      - 'pom.xml'
      - '.github/workflows/tenant-isolation-spike.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  spike:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17.11
        env:
          POSTGRES_USER: vernac
          POSTGRES_PASSWORD: ephemeral-spike-only
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vernac -d postgres"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      VERNAC_PG_TEST_URL: jdbc:postgresql://localhost:5432/postgres
      VERNAC_PG_TEST_USER: vernac
      VERNAC_PG_TEST_PASSWORD: ephemeral-spike-only
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - name: Build production runtime and run its unit tests
        run: mvn -B -ntp -pl vernac-lsp,vernac-runtime-jdbc -am clean install
      - name: Execute real PostgreSQL and Spring boundary tests
        run: mvn -B -ntp -f experiments/tenant-isolation-spike/pom.xml clean verify
      - name: Execute tenant schema replay and schema-check policy proofs
        run: mvn -B -ntp -pl vernac-maven-plugin -am -Dtest=DocumentationExamplesTest,TenantSchemaPostgresTest,SchemaMojoTest,ExplicitTenancyMojoTest,TenantGeneratedPostgresTest,RepositoryQueryPostgresTest,ScalarQueryPostgresTest,ModuleMigrationPostgresTest,EventStoragePostgresTest,EventWorkerPostgresTest -Dsurefire.failIfNoSpecifiedTests=false test
      - name: Require every spike proof to execute
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          report = Path('experiments/tenant-isolation-spike/target/surefire-reports/TEST-org.vernac.experiments.tenancy.TenantIsolationPostgresTest.xml')
          root = ET.parse(report).getroot()
          required = {
              'missingAuthenticationMembershipAndTransactionFailClosed',
              'byIdFindOrCountAndRawSqlAreTenantScoped',
              'unmarkedGlobalDataNeedsNoTenantAndDoesNotBindOne',
              'runtimeRoleAndForcedOwnerProtectionAreReal',
              'coordinatorRejectsIncompleteConfigurationAndUnsafeChildTables',
              'coordinatorRejectsSchemaCreationAndTruncatePrivileges',
              'rowSecurityBlocksCrossTenantWritesAndForeignKeysBlockCrossTenantLinks',
              'requiredAndRequiresNewBindDifferentConnectionsAndRestoreOuterContext',
              'caughtInnerRequiredFailureMakesOuterTransactionRollbackOnly',
              'innerPermissionIsCheckedOnlyWhenReachedAndBeforeItsBody',
              'ownershipAndRollbackPreventRetaggingWhileStaleVersionsStillConflict',
              'sameThreadAndPooledConnectionsDoNotLeakAcrossRepeatedRequestsOrRollback',
              'twoThreadsHaveIndependentSecuritySelectionsAndPhysicalTransactions',
              'staleSessionTenantAndMidTransactionSettingTamperingAreRejected',
          }
          cases = {case.attrib['name']: case for case in root.findall('testcase')}
          missing = required - cases.keys()
          assert not missing, f'Missing required proofs: {sorted(missing)}'
          for name, case in cases.items():
              assert not any(case.find(tag) is not None for tag in ('skipped', 'failure', 'error')), f'Unverified proof: {name}'
          assert all(int(root.attrib.get(key, '0')) == 0 for key in ('failures', 'errors', 'skipped'))
          print(f'{len(cases)} real PostgreSQL/Spring proofs executed; none skipped.')
          runtime_proofs = {
              'TenantContextTest': {
                  'selectionIsExplicitLifoAndRestorableWithoutStartingTransactions',
                  'scopeIsThreadOwnedAndDoesNotPropagateToOtherThreads',
                  'pinRequiresSynchronizedTransactionAndLiveSelection',
                  'repeatedBindingIsStableUntilCommitAndDoesNotConsumeUnrelatedResources',
                  'selectionOpenedInsideTransactionRemainsPinnedAfterScopeClose',
                  'rollbackCleansThePinButDoesNotCloseTheCallersScope',
                  'scopeCloseDoesNotUnpinAnActiveTransactionOrAuthorizeAnotherTenant',
                  'closingAScopeCannotRestoreADifferentTenantInsideAPinnedTransaction',
              },
              'TenantOwnershipTest': {
                  'legacyPersistenceStateStaysUnscopedEvenInsideTenantSelection',
                  'newRootCapturesSelectionButNewEntityWaitsForItsRoot',
                  'firstAssignmentIsOneWayAndVersionResetDoesNotRemoveOwnership',
                  'restoredAndDetachedStateCannotBeConvertedIntoNewOrForeignOwnership',
                  'competingFirstOwnersCannotBothClaimTheSameObject',
                  'diagnosticStringsAndTechnicalFailuresDoNotExposeTenantValues',
              },
              'TenantIdTest': {
                  'typedIdentityHasExplicitStorageRepresentationAndSafeDefaultRendering',
                  'malformedInputIsNotCopiedIntoAnExceptionOrCause',
              },
          }
          for suite, expected in runtime_proofs.items():
              path = Path('vernac-runtime/target/surefire-reports') / f'TEST-org.vernac.runtime.tenancy.{suite}.xml'
              result = ET.parse(path).getroot()
              tests = {case.attrib['name']: case for case in result.findall('testcase')}
              assert not (expected - tests.keys()), f'Missing runtime proofs in {suite}'
              assert all(int(result.attrib.get(key, '0')) == 0 for key in ('failures', 'errors', 'skipped'))
              for name, case in tests.items():
                  assert not any(case.find(tag) is not None for tag in ('skipped', 'failure', 'error')), f'Unverified runtime proof: {name}'
          print('All production runtime foundation proofs executed; none skipped.')
          schema_proofs = {
              'vernac-maven-plugin/target/surefire-reports/TEST-org.vernac.maven.DocumentationExamplesTest.xml': {
                  'diagramTutorialShowsTheActualGeneratedGraph',
                  'persistentModuleTutorialHasACompleteExportableProducerModel',
                  'completeTutorialModelsResolveAndGenerate',
                  'paginationTutorialGeneratesCompilableJava',
                  'dispatchPaginationModelAndItsGeneratedJavaCompile',
                  'aiReferenceExamplesCompileTogetherIncludingHandwrittenJava',
                  'dddBeginnerModelsGenerateCompilableJava',
                  'entryPointsTellTheSameExecutableStory',
              },
              'vernac-compiler/target/surefire-reports/TEST-org.vernac.compiler.persistence.TenantMappingTest.xml': {
                  'completeOwnedGraphUsesTenantKeysAndLegacyGlobalGraphStaysUnscoped',
                  'reusableTenantModulesAreRejectedUntilMetadataAndActivationSupportExist',
                  'sourceClassificationRemovalReachesSpecificMigrationGuard',
              },
              'vernac-runtime/target/surefire-reports/TEST-org.vernac.runtime.events.EventContextTest.xml': {
                  'tenantContextAllowsSynchronousEventsButRejectsUnscopedStoredDelivery',
              },
              'vernac-maven-plugin/target/surefire-reports/TEST-org.vernac.maven.TenantGeneratedPostgresTest.xml': {
                  'generatedTenantRepositoriesCompile',
                  'generatedGraphsQueriesPaginationAndOwnershipRemainTenantScoped',
                  'concurrentGeneratedRepositoriesRetainIndependentTenantTransactions',
                  'generatedStoresRejectOwnerRolesAndChangedPolicies',
                  'tenantMigrationBackfillsAllTenantsWithDedicatedMigrationPrivileges',
              },
              'vernac-maven-plugin/target/surefire-reports/TEST-org.vernac.maven.RepositoryQueryPostgresTest.xml': {
                  'generatedRepositoryCompiles',
                  'generatedRepositoryCompilesWithSeveralExplicitReturnCollections',
                  'generatedRepositoryExecutesQueriesAndLoadsCompleteGraphs',
              },
              'vernac-maven-plugin/target/surefire-reports/TEST-org.vernac.maven.ScalarQueryPostgresTest.xml': {
                  'textSearchMatchesLiteralJavaOperationsAndLikePatterns',
                  'equalityAndInequalityMatchJavaForEveryScalarFamily',
              },
              'vernac-maven-plugin/target/surefire-reports/TEST-org.vernac.maven.ModuleMigrationPostgresTest.xml': {
                  'fixtureModulesCompileAndShareTheRuntimeFingerprintContract',
                  'durableFixturesKeepPayloadAndSharedDeliveryOwnershipSeparate',
                  'deferredModuleReceiversResumeAfterRestartAndRetryWithoutDuplicatingCommittedWrites',
                  'freshStartupRestartSeparateHistoriesAndRequiredTransactions',
                  'failedLaterHistoryStopsApplicationAndRetryRetainsEarlierSuccess',
                  'upgradesModuleAndApplicationCopiesOfAnExternalValueWithExistingData',
                  'synchronousModuleListenerFailureRollsBackTheCallingTransaction',
                  'manualOwnedSchemaDriftBlocksRestart',
              },
              'vernac-maven-plugin/target/surefire-reports/TEST-org.vernac.maven.EventStoragePostgresTest.xml': {
                  'generatedEventStorageCompiles',
                  'eventGraphsAndDeliveriesCommitOrRollbackTogether',
              },
              'vernac-maven-plugin/target/surefire-reports/TEST-org.vernac.maven.EventWorkerPostgresTest.xml': {
                  'generatedWorkerFixtureCompiles',
                  'workersRetryFenceAndRecoverClaims',
              },
              'vernac-maven-plugin/target/surefire-reports/TEST-org.vernac.maven.ExplicitTenancyMojoTest.xml': {
                  'compileSchemaAndForcedMigrationRejectMissingClassificationBeforeWriting',
                  'explicitGlobalBuildAndSchemaRemainUsableInStrictMode',
              },
              'vernac-compiler/target/surefire-reports/TEST-org.vernac.compiler.tenancy.ExplicitTenancyTest.xml': {
                  'applicationSettingIsOrderIndependentAndDoesNotChangeBindings',
                  'moduleSettingIsOrderIndependentAndRejectsDuplicatesAndUnknownModes',
                  'globalDeclarationKeepsExistingGeneratedJavaAndSchema',
                  'applicationRuleRejectsBarePersistedAggregateAndAcceptsExplicitGlobal',
                  'moduleRuleCoversPrivatePersistedTypesButDoesNotRequireClassificationWithoutPersistence',
                  'applicationRuleDoesNotReclassifyExternalSources',
              },
              'vernac-lsp/target/surefire-reports/TEST-org.vernac.lsp.ExplicitTenancySymbolsTest.xml': {
                  'unsavedApplicationPolicyAndModelChangesShareCompilerRule',
                  'unsavedModulePolicyAlsoChecksPrivatePersistedTypes',
                  'compositionCompletionsOfferTheExplicitRule',
              },
              'vernac-compiler/target/surefire-reports/TEST-org.vernac.compiler.persistence.TenantSchemaTest.xml': {
                  'classificationRoundTripsWithoutChangingLegacySnapshotBytes',
                  'newTenantGraphKeepsRootIdentityAndOrderedChildKeysAndAddsRls',
                  'classificationChangesFailClosedEvenWhenForceIsRequested',
                  'incompleteAndCrossBoundaryGraphsAreRejected',
                  'historyCanAddNewTenantTablesAfterLegacySnapshotsWithoutRewritingHistory',
                  'checkedInExampleHistoryRetainsPublishedFingerprints',
              },
              'vernac-maven-plugin/target/surefire-reports/TEST-org.vernac.maven.TenantSchemaPostgresTest.xml': {
                  'generatedCandidateEnforcesTenantRowsAndQualifiedChildReferences',
                  'schemaCheckCatalogDetectsPolicyAndRlsDriftButIgnoresForeignTables',
              },
              'vernac-maven-plugin/target/surefire-reports/TEST-org.vernac.maven.SchemaMojoTest.xml': {
                  'schemaGoalDoesNotChangeHistoryAndMigrationGoalWritesInitialAndNextCandidates',
                  'databaseUrlOnlyChangesDatabaseComponent',
                  'postgresReplaysInitialAndNextMigrationAndDetectsOwnedDrift',
              },
          }
          for path, expected in schema_proofs.items():
              root = ET.parse(path).getroot()
              cases = {c.attrib['name']: c for c in root.findall('testcase')}
              assert not (expected - cases.keys()), f'Missing schema proofs in {path}'
              assert all(int(root.attrib.get(k, '0')) == 0 for k in ('failures', 'errors', 'skipped'))
              for name, case in cases.items():
                  assert not any(case.find(t) is not None for t in ('skipped', 'failure', 'error')), f'Unverified schema proof: {name}'
          print('All tenant schema and Maven/PostgreSQL proofs executed; none skipped.')
          PY
