                  'failedAllocationAndCleanupRollBackAccountingButNotTheGlobalAttempt',
                  'concurrentConfigurationInitializationAndDigestCollisionsFailSafely',
              },
              'saas/identity-spring-security/target/surefire-reports/TEST-org.vernac.saas.identity.security.credentials.BoundedCredentialPasswordsTest.xml': {
                  'defaultsAndConfigurationAreExplicitAndFinite',
                  'fixedWorkersAndQueueRejectOverflowWithoutCallerRunsOrExtraWork',
                  'queuedTimeoutRemovesCancelledWorkAndNeverExecutesItLater',
                  'interruptedCallerDoesNotRefundAStillRunningHashSlot',
                  'closeCancelsQueuedWorkAndRetainsRealRunningCapacityUntilCompletion',
                  'errorsAreSanitizedAndWorkerThreadsDoNotInheritRequestContext',
                  'transactionResourcesAndNestedSubmissionAreRejectedBeforeWork',
