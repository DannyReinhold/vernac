name: Independent SaaS application
on:
  pull_request:
    paths:
      - 'examples/saas-document-workspace/**'
      - 'vernac-intellij/**'
      - 'tools/verify-local-wizard.mjs'
      - 'saas/**'
      - 'vernac-runtime-jdbc/**'
      - 'vernac-compiler/**'
      - '.github/workflows/saas-application.yml'
      - 'tests/upgrades/**'
      - 'tools/verify-upgrades.py'
      - 'tools/pg-service-clients.sh'
      - 'tools/tests/test_upgrade_baseline.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  consumer:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:17.11
        env:
          POSTGRES_USER: vernac
          POSTGRES_PASSWORD: ephemeral-saas-only
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vernac -d postgres"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      VERNAC_PG_TEST_URL: jdbc:postgresql://localhost:5432/postgres
      VERNAC_PG_TEST_USER: vernac
      VERNAC_PG_TEST_PASSWORD: ephemeral-saas-only
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Use matching PostgreSQL service clients
        env:
          VERNAC_PG_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          echo "VERNAC_PG_CONTAINER=$VERNAC_PG_CONTAINER" >> "$GITHUB_ENV"
          sh tools/pg-service-clients.sh

      - name: Install matching producers and compiler
        run: mvn -B -ntp -pl saas/local-development,saas/billing-spring-mvc,saas/invoicing-pdf,saas/restrictions,saas/payments-mollie,saas/payments-stripe,saas/identity-jdbc,saas/mail-local,saas/mail-brevo -am -DskipTests install
      - name: Verify billing escaping and identity composition
        run: mvn -B -ntp -pl saas/local-development,saas/billing-spring-mvc,saas/identity-spring-security test
      - name: Verify durable payment lifecycle policy
        run: |
          mvn -B -ntp -pl saas/payments-jdbc verify
          python3 - <<'PYTEST'
          import xml.etree.ElementTree as ET
          r=ET.parse('saas/payments-jdbc/target/failsafe-reports/TEST-org.vernac.saas.payments.persistence.PaymentFlowPostgresIT.xml').getroot()
          assert int(r.attrib['tests']) >= 12 and all(int(r.attrib.get(k,'0')) == 0 for k in ['failures','errors','skipped'])
          PYTEST
      - name: Package the standalone consumer
        run: mvn -B -ntp -f examples/saas-document-workspace/pom.xml clean package
      - name: Install real browser
        working-directory: examples/saas-document-workspace/browser
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Verify acceptance evidence gate
        run: python3 -m unittest discover -s examples/saas-document-workspace -p test_acceptance_gate.py
      - name: Execute restricted PostgreSQL and HTTPS browser journeys
        run: python3 examples/saas-document-workspace/verify.py
      - name: Verify every versioned upgrade baseline
        run: |
          python3 -m unittest discover -s tools/tests -p test_upgrade_baseline.py
          python3 tools/verify-upgrades.py
      - name: Publish sanitized scenario evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: saas-scenario-evidence
          path: |
            examples/saas-document-workspace/target/acceptance-reports/
            examples/saas-document-workspace/target/upgrade-reports/
          if-no-files-found: error
  wizard-start:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Install Wizard and matching SaaS producers
        run: mvn -B -ntp -pl vernac-intellij,saas/local-development,saas/billing-spring-mvc,saas/invoicing-pdf,saas/payments-mollie,saas/payments-stripe,saas/mail-local,saas/mail-brevo -am -DskipTests install
      - name: Generate independent Wizard project
        run: |
          mvn -B -ntp -pl vernac-intellij dependency:build-classpath -Dmdep.outputFile=target/wizard-classpath.txt
          java -cp "vernac-intellij/target/test-classes:vernac-intellij/target/classes:$(cat vernac-intellij/target/wizard-classpath.txt)" org.vernac.intellij.SaasWizardAcceptanceProject target/wizard-acceptance
          mvn -B -ntp -f target/wizard-acceptance/pom.xml package
      - name: Install browser for normal developer acceptance
        working-directory: target/wizard-acceptance/browser
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Start and restart the ordinary generated application without Python
        run: node tools/verify-local-wizard.mjs target/wizard-acceptance
      - name: Publish normal-start evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: wizard-normal-start-evidence
          path: target/wizard-acceptance/target/acceptance-reports/normal-start.json
          if-no-files-found: error
      - name: Stop local development database
        if: always()
        working-directory: target/wizard-acceptance
        run: docker compose --env-file .local/compose.env down -v
