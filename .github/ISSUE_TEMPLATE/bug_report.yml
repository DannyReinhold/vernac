name: Bug report
description: Report a reproducible compiler, runtime, tooling or documentation problem.
body:
  - type: markdown
    attributes:
      value: "For vulnerabilities, follow SECURITY.md instead. Remove secrets and customer data."
  - type: textarea
    id: problem
    attributes:
      label: Expected and actual behavior
      description: What were you trying to do, what did you expect, and what happened?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproduction
      description: Include a small model, commands or IDE steps, and relevant error output.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Versions and environment
      description: Vernac version, OS, JDK and Maven; for IDE issues also the exact IntelliJ build and plugin version. Has generated Java already been built?
    validations:
      required: true
