services:
  postgres:
    image: postgres:17.11
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: vernac
      POSTGRES_PASSWORD: local-spike-only
    ports:
      - "127.0.0.1:55439:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vernac -d postgres"]
      interval: 2s
      timeout: 3s
      retries: 30
