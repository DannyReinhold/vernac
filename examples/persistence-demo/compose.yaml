services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: delivery
      POSTGRES_USER: delivery
      POSTGRES_PASSWORD: local-demo-only
    ports:
      - "127.0.0.1:55433:5432"
    volumes:
      - delivery-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U delivery -d delivery"]
      interval: 2s
      timeout: 3s
      retries: 30
  postgres-test:
    image: postgres:17-alpine
    profiles: [test]
    labels:
      org.springframework.boot.ignore: "true"
    environment:
      POSTGRES_DB: delivery_test
      POSTGRES_USER: delivery
      POSTGRES_PASSWORD: local-demo-only
    ports:
      - "127.0.0.1:55434:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U delivery -d delivery_test"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  delivery-data:
