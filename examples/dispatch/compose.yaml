name: vernac-dispatch
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: dispatch
      POSTGRES_USER: dispatch
      POSTGRES_PASSWORD: local-showcase-only
    ports:
      - "127.0.0.1:55435:5432"
    volumes:
      - dispatch-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dispatch -d dispatch"]
      interval: 2s
      timeout: 3s
      retries: 30
  postgres-test:
    image: postgres:17-alpine
    profiles: [test]
    labels:
      org.springframework.boot.ignore: "true"
    environment:
      POSTGRES_DB: dispatch_test
      POSTGRES_USER: dispatch
      POSTGRES_PASSWORD: local-showcase-only
    ports:
      - "127.0.0.1:55436:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dispatch -d dispatch_test"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  dispatch-data:
