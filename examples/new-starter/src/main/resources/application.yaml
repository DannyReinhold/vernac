spring:
  application:
    name: "new-starter"
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
  docker:
    compose:
      enabled: false
  flyway:
    enabled: true
server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${PORT:8080}
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
        secure: ${COOKIE_SECURE:true}
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        readiness:
          include: readinessState,db
logging:
  level:
    root: ${LOG_LEVEL:INFO}
