spring.application.name=vernac-saas-document-workspace
spring.http.converters.preferred-json-mapper=jackson2
spring.sql.init.mode=never
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.datasource.hikari.maximum-pool-size=8
spring.datasource.hikari.minimum-idle=0
server.address=127.0.0.1
server.port=8443
server.ssl.enabled=true
server.ssl.key-store-type=PKCS12
server.forward-headers-strategy=none
server.error.include-message=never
server.error.include-stacktrace=never
server.tomcat.max-http-form-post-size=16384
server.tomcat.max-swallow-size=16384
server.tomcat.threads.max=32
server.tomcat.accept-count=32
server.tomcat.connection-timeout=5s
logging.level.org.springframework.jdbc=OFF
logging.level.com.zaxxer.hikari=OFF
