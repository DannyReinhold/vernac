spring:
  application:
    name: "vernac-saas-document-workspace"
  http:
    converters:
      preferred-json-mapper: "jackson"
  sql:
    init:
      mode: "never"
  flyway:
    enabled: "true"
    locations: "classpath:db/migration"
  datasource:
    hikari:
      maximum-pool-size: "8"
      minimum-idle: "0"
server:
  address: "127.0.0.1"
  port: "8443"
  ssl:
    enabled: "true"
    key-store-type: "PKCS12"
  forward-headers-strategy: "none"
  error:
    include-message: "never"
    include-stacktrace: "never"
  tomcat:
    max-http-form-post-size: "16384"
    max-swallow-size: "16384"
    threads:
      max: "32"
    accept-count: "32"
    connection-timeout: "5s"
logging:
  level:
    org.springframework.jdbc: "OFF"
    com.zaxxer.hikari: "OFF"
