<style xmlns:th="http://www.thymeleaf.org" th:fragment="style">
*{box-sizing:border-box}body{margin:0;background:#eff5f4;color:#102e35;font:16px/1.65 system-ui,sans-serif}main{width:min(100% - 2rem,64rem);margin:clamp(1rem,7vw,6rem) auto;padding:clamp(1.5rem,5vw,4rem);background:white;border:1px solid #d6e5e2;border-radius:1.5rem;box-shadow:0 24px 64px #102e3514}h1,h2{line-height:1.1;letter-spacing:-.04em}h1{font-size:clamp(2rem,6vw,4rem);margin:.4em 0}h2{margin-top:1.8em}a{color:#09685d;text-underline-offset:.22em}a:focus-visible,button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #38a799;outline-offset:4px}button,.primary{display:inline-block;padding:.75rem 1.25rem;border:0;border-radius:.65rem;background:#08675d;color:white;font:inherit;font-weight:700;text-decoration:none;cursor:pointer}label{display:block;font-weight:650}input:not([type=hidden]),textarea{display:block;width:100%;max-width:40rem;margin:.35rem 0;padding:.65rem;border:1px solid #91aaa7;border-radius:.5rem;font:inherit}textarea{min-height:8rem}ul{padding:0;list-style:none}li{border:1px solid #d6e5e2;border-radius:.8rem;padding:1rem;margin-bottom:1rem}li form{display:inline-block;margin:.25rem}nav{display:flex;flex-wrap:wrap;gap:1rem;align-items:center}footer{margin-top:2rem;border-top:1px solid #d6e5e2;padding-top:1rem}.eyebrow{color:#09685d;font-weight:750;letter-spacing:.12em;text-transform:uppercase;font-size:.75rem}
header + nav { border-block: 1px solid #d6e5e2; padding-block: 1rem; }
.secondary { color: #14564f; background: #e6f3ef; }
.danger { color: #933b36; background: #fff2ee; }
main > section li > strong { font-size: 1.2rem; }
main > section li > p { white-space: pre-wrap; overflow-wrap: anywhere; }
@media (max-width: 36rem) { nav { gap: .75rem; } main { padding: 1.25rem; } }
.topbar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:1rem;width:min(100% - 2rem,72rem);margin:auto;padding:1.15rem 0;border-bottom:1px solid #cbded9}
.brand{color:#102e35;font-weight:800;text-decoration:none}
.landing main,.application main{width:min(100% - 2rem,72rem);margin:0 auto;padding:0;background:none;border:0;border-radius:0;box-shadow:none}
.hero{padding:clamp(2rem,8vw,7rem) 0;display:grid;grid-template-columns:1.35fr 1fr;gap:clamp(1.5rem,5vw,5rem);align-items:center}
.hero p{max-width:38ch;margin-bottom:1.6rem}
.library-preview,.plan,.settings,.document,.composer{background:white;border:1px solid #cbded9;border-radius:.85rem}
.library-preview{display:grid;padding:1.5rem;gap:.65rem;box-shadow:0 20px 45px #102e3514;transform:rotate(-2deg)}
.library-preview span{display:block;padding:.65rem 1rem;background:#eff5f4;border-radius:.4rem}
.plan-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1rem}
.plan,.settings{padding:clamp(1.1rem,3vw,2rem)}
.plan h3,.settings h2{margin:0}
.price{font-size:2rem;font-weight:800;margin:.45rem 0}
.price small,.muted{font-size:.9rem;color:#456462;font-weight:500}
.application main{max-width:62rem;padding:clamp(1rem,5vw,3rem) 0}
.application h1{font-size:clamp(2rem,5vw,3rem)}
.composer,.document,.settings{margin:1rem 0}
.composer,.document{padding:1rem 1.25rem}
summary{cursor:pointer;font-weight:700}
.document-text{white-space:pre-wrap;overflow-wrap:anywhere}
.document-actions{display:flex;flex-wrap:wrap;align-items:start;gap:1rem;border-top:1px solid #d6e5e2;padding-top:1rem}
.document-actions summary{padding:.65rem}
.empty-state{border:1px dashed #91aaa7;border-radius:.75rem;text-align:center;padding:2rem 1rem}
.settings-links{margin:0}
.settings-links li{padding:.5rem 0;margin:0;border:0}
@media(max-width:45rem){.hero,.plan-grid{grid-template-columns:1fr}.library-preview{transform:none}}
</style>
