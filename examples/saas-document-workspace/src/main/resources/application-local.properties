vernac.mail.provider=org.vernac.saas.mail.local.NoopMailProvider
identity.origin=https://localhost:8443
identity.allow-loopback-simulation=true
vernac.mail.local.max-messages=100
vernac.mail.local.max-bytes=1048576
vernac.mail.local.retention=PT10M

vernac.payments.provider=org.vernac.saas.payments.local.LocalPaymentProvider
vernac.payments.local.scenario=PAID
billing.profile=local-v1
billing.allow-simulation=true
billing.seller.name=Vernac Local Demonstration
billing.seller.street=Beispielstrasse 1
billing.seller.postal-code=28199
billing.seller.city=Bremen
billing.seller.tax-identifier=DE123456789
billing.seller.email=seller@example.test
billing.seller.tax-treatment=STANDARD_19

vernac.payments.local.allowed=true

# Independent operator capability: customer login never authorizes refunds.
billing.operator.enabled=true
