services:
  db:
    image: postgres:17.11
    environment:
      POSTGRES_USER: vernac
      POSTGRES_DB: workspace
      POSTGRES_PASSWORD: ${LOCAL_DATABASE_PASSWORD:?Start with python3 run-local.py}
    ports:
      - "127.0.0.1:${LOCAL_DB_PORT:-55439}:5432"
    volumes:
      - workspace-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U vernac -d workspace"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  workspace-data:
