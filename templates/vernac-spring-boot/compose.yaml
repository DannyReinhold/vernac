# Local development only. Run one copy per directory; choose another port for a second project.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: tasks
      POSTGRES_USER: tasks
      POSTGRES_PASSWORD: local-development-only
    ports:
      - "127.0.0.1:${LOCAL_DB_PORT:-55439}:5432"
    volumes:
      - task-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tasks -d tasks"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  task-data:
